[project]
name = "amazfit-homelab-bridge"
version = "0.1.0"
description = "BLE bridge between Amazfit GTS 2e and a homelab data pipeline"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
